<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Samm Calendar Widget</title>
  <style>
    :root{
      /* Forest / moss palette */
      --bg: #0F1A15;        /* deep forest green-black */
      --panel: #0B1612;     /* darker moss panel */
      --border: rgba(168,200,186,.16);
      --text: #E8F2EC;      /* soft mist white */
      --muted: #9FBFB0;     /* sage grey */
      --radius: 16px;

      /* Tint strength (raise to 0.18 for more green, lower to 0.10 for subtle) */
      --tint: 0.14;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: transparent;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
    }

    .wrap{
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;

      /* Mossy, candlelight depth */
      box-shadow: 0 16px 40px rgba(15,40,30,.45);

      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .topbar{
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0));
      border-bottom: 1px solid var(--border);
    }

    .title{
      font-size: 13px;
      letter-spacing: .2px;
      color: var(--muted);
      user-select: none;
    }

    .hint{
      font-size: 12px;
      color: rgba(232,242,236,.65);
      user-select: none;
    }

    .frame{
      position: relative;
      background: var(--panel);
      overflow: hidden; /* keeps overlay clean */
    }

    /* The big “greener” change: a moss tint overlay */
    .frame::after{
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

      /* Moss tint */
      background: rgba(95, 143, 123, var(--tint));

      /* Multiply makes it feel like stained glass over the calendar */
      mix-blend-mode: multiply;
    }

    .frame iframe{
      width: 100%;
      height: 820px; /* Month view needs height */
      border: 0;
      display: block;

      /*
        Dark mode trick:
        invert makes Google white UI dark, hue-rotate steers it away from harsh blues.
        If colors look weird, we can tweak these 5 values.
      */
      filter: invert(1) hue-rotate(165deg) saturate(1.10) contrast(1.04) brightness(0.96);
      background: transparent;
    }

    @media (max-width: 700px){
      .frame iframe{ height: 720px; }
      .hint{ display:none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">🌿Living Schedule</div>
      <div class="hint">Month view, moss-tinted for Notion</div>
    </div>

    <div class="frame">
      <iframe
        src="https://calendar.google.com/calendar/embed?src=samm.bennett1124%40gmail.com&ctz=America%2FNew_York&mode=MONTH&showTitle=0&showNav=0&showPrint=0&showCalendars=0&showTabs=0"
        scrolling="no"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        aria-label="Google Calendar"
      ></iframe>
    </div>
  </div>
</body>
</html>
